# ═══════════════════════════════════════════════════════════════════════════════
#  Artifacts Items & Custom Abilities Configuration
#
#  Customize any artifact item: display name, base material, custom model data,
#  item model key, curio slot type, lore, 3D model options, and extra abilities.
#
#  Abilities use CuriosPaper's built-in ability system.
#  Triggers:
#    - WHILE_EQUIPPED : Active continuously while equipped in a curio slot
#    - EQUIP          : Triggers once when equipped
#    - DE_EQUIP        : Triggers once when removed
#
#  Effect Types:
#    - POTION_EFFECT   : Applies Bukkit PotionEffect (e.g. SPEED, REGENERATION, NIGHT_VISION)
#    - PLAYER_MODIFIER : Applies Bukkit AttributeModifier (e.g. GENERIC_MAX_HEALTH, GENERIC_ATTACK_DAMAGE)
#                        Note: For PLAYER_MODIFIER, amplifier is stored as (value * 100).
#                        Example: amplifier 400 = +4.0 max health (+2 hearts).
#                        Operations: ADD_NUMBER (default), ADD_SCALAR, MULTIPLY_SCALAR_1
#
#  Example custom ability setup:
#    abilities:
#      speed_buff:
#        trigger: WHILE_EQUIPPED
#        effect-type: POTION_EFFECT
#        effect-name: SPEED
#        amplifier: 0
#        duration: 100
#      extra_health:
#        trigger: WHILE_EQUIPPED
#        effect-type: PLAYER_MODIFIER
#        effect-name: GENERIC_MAX_HEALTH
#        amplifier: 400
#        operation: ADD_NUMBER
# ═══════════════════════════════════════════════════════════════════════════════

